# nginx snippet for HTTPS + security headers
server {
    listen 80;
    server_name powersg.com.tr www.powersg.com.tr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name powersg.com.tr www.powersg.com.tr;

    ssl_certificate /etc/letsencrypt/live/powersg.com.tr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/powersg.com.tr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https:" always;

    root /var/www/powersg;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
